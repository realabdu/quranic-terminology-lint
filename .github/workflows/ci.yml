name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: pre-commit validate-manifest
      - run: python -m pytest -q
      - run: quranic-terminology-lint
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/terminology-wheel
          /tmp/terminology-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/terminology-wheel/bin/quranic-terminology-lint --version
          /tmp/terminology-wheel/bin/quranic-terminology-lint "$GITHUB_WORKSPACE/examples/passing"
