[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quranic-terminology-lint"
version = "0.3.0"
description = "Checks that names in code follow the Quranic vocabulary naming standard"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
quranic-terminology-lint = "quranic_terminology_lint.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pre-commit>=3.2", "build"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
quranic_terminology_lint = ["terms/*.tsv"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
