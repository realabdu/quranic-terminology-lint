- id: quranic-terminology
  name: Quranic terminology
  description: Check that names follow the Quranic vocabulary naming standard
  entry: quranic-terminology-lint
  language: python
  types: [text]
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: '3.2.0'
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
- id: quranic-terminology-unsafe-fix
  name: Quranic terminology (unsafe fix)
  description: Apply supported terminology replacements; code renames may break imports, APIs and bindings
  entry: quranic-terminology-lint --unsafe-fixes
  language: python
  types: [text]
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: '3.2.0'
  stages: [pre-commit, manual]
