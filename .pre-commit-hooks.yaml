- id: quranic-terminology
  name: Quranic terminology
  description: Check that names follow the Quranic vocabulary naming standard
  entry: quranic-terminology-lint
  language: python
  types: [text]
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: '3.2.0'
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
- id: quranic-terminology-fix
  name: Quranic terminology (fix)
  description: Rename names that break the Quranic vocabulary naming standard
  entry: quranic-terminology-lint --fix
  language: python
  types: [text]
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: '3.2.0'
  stages: [pre-commit, manual]
